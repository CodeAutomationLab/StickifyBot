[package]
name = "sticker_converter_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls"] }
tokio = { version = "1", features = ["full"] }
libloading = "0.8"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "fast-rng"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
tempfile = "3.17"
futures = "0.3"


